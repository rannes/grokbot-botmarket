services:
  botmarket:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - botmarket-data:/data
    environment:
      PORT: "3000"
      BOTMARKET_DATA_DIR: /data
      # Enables /admin. Generate one with: openssl rand -hex 24
      # BOTMARKET_ADMIN_TOKEN: change-me
      # Hold new submissions until an admin approves them.
      # BOTMARKET_REQUIRE_APPROVAL: "true"
      # BOTMARKET_SITE_NAME: BotMarket
      # Recommended in production; used for absolute recipe and OpenGraph URLs.
      # BOTMARKET_PUBLIC_URL: https://bots.example.com
      # Enabled by default: seeds 10 example bots into an empty database.
      # Set to "false" for a clean production instance.
      # BOTMARKET_SEED: "false"
      # Set to "true" behind a reverse proxy to trust X-Forwarded-* headers.
      # BOTMARKET_TRUST_PROXY: "true"
    restart: unless-stopped

volumes:
  botmarket-data:
